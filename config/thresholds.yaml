# Kai decision thresholds and judge constants (DESIGN.md §4-§5, PHASE4_PLAN.md §3).
# Edit by hand; values are validated at load time. Override the path with KAI_THRESHOLDS_PATH.

# Persona applies ONLY here, to the judge's decision. Agents and valuation inputs never see it.
#   buy_score / sell_score   : debate score S (from -1 to +1) needed for Buy / Sell
#   min_margin_of_safety     : DCF margin of safety needed for Buy (0.25 = 25%)
#   max_volatility           : annualised volatility allowed for Buy (null = no limit)
#   buy_requires_dcf         : if true, Buy is impossible when no DCF could be computed
personas:
  zen:      {buy_score: 0.50, min_margin_of_safety: 0.25, max_volatility: 0.35, sell_score: -0.20, buy_requires_dcf: true}
  balanced: {buy_score: 0.35, min_margin_of_safety: 0.15, max_volatility: 0.50, sell_score: -0.30, buy_requires_dcf: true}
  alpha:    {buy_score: 0.25, min_margin_of_safety: 0.00, max_volatility: null, sell_score: -0.40, buy_requires_dcf: false}

# Claim verification (faithfulness)
verification:
  numeric_tolerance: 0.01      # relative tolerance when recomputing a numeric claim
  min_checkable_claims: 3      # faithfulness denominator floor
  min_quote_chars: 15          # shortest quote accepted as evidence

circuit_breaker:
  min_agent_faithfulness: 0.60 # agents below this after round 1 are dropped
  min_valid_agents: 2          # fewer valid agents -> NO_VERDICT
  token_limit: 80000           # all LLM calls in all rounds (four agents x three rounds; measured
                               # 61-62k in live runs where one agent's round 3 was skipped for budget)

# The judge weighs the domains (agents stay in their own lane and never weigh each other).
# Debate score S = weighted mean of the valid agents' scores; weights are renormalised over the
# agents that count. Coverage in confidence = weight of counted agents / total weight.
judge:
  weights: {charlie: 0.30, gamma: 0.30, delta: 0.20, vega: 0.20}

integrity:
  unexplained_stance_penalty: 0.25
  retained_failed_claim_penalty: 0.50

# Discount rate = risk-free + beta x equity risk premium, the same for every persona
capm:
  equity_risk_premium: 0.05
  beta_clamp: [0.5, 2.0]
  rate_clamp: [0.06, 0.15]
  fallback_rate: 0.10          # used, with a warning, when beta or the risk-free rate is unavailable
  terminal_growth: 0.025

hitl:
  approval_confidence: 60      # Buy/Sell at or above this confidence needs human approval
  # Buy/Sell below approval_confidence: "warn" = explicit low-confidence warning notification,
  # "approve" = also needs human approval. Never delivered as a plain success notification.
  low_confidence_action: warn
  approval_timeout_minutes: 5

# Quant layer (DESIGN.md §10). Deterministic statistics; no LLM computes any of these numbers.
quant:
  seed: 42                       # recorded in every report; same inputs + seed = same numbers
  returns: {window_days: 252, min_obs: 60}
  market: {min_obs: 60}
  forward:
    horizon_days: 63
    paths: 10000
    block_length: 5              # moving-block bootstrap
    outer_resamples: 200         # interval from resampling the history
    outer_paths: 2000
    min_obs: 120
    # zero       = trend removed: log returns de-meaned, median path flat (default)
    # historical = past year's average daily log return carried forward
    drift_mode: zero
  mc_dcf:
    simulations: 10000
    growth_clamp: [-0.05, 0.15]  # centre = historical FCF CAGR, clamped
    growth_sd_floor: 0.02
    growth_clip: [-0.20, 0.30]
    discount_sd: 0.01            # around the CAPM rate; persona never enters
    terminal_range: [0.015, 0.03]
    min_spread: 0.02             # draws with discount - terminal < this are rejected
  base_rate:
    history_years: 10
    horizon_days: 63
    momentum_days: 126
    momentum_band: 0.10          # similar: momentum within +/-10 percentage points
    pe_band: 0.25                # similar: trailing PE within +/-25%
    min_cases: 30
  calibration:
    path: data/calibration/pairs.csv
    field: forward.prob_up_bootstrap
    bins: 10
    min_pairs: 20
    max_brier: 0.25              # worse than a coin flip -> forward signal ignored
  confidence:
    agreement_weight: 0.5        # Q floor = 1 - 0.5
    contradiction_margin: 0.05   # bullish with p < 0.45 or bearish with p > 0.55
    contradiction_penalty: 0.5   # C floor = 1 - 0.5
